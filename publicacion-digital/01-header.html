<style>
  .pd-header * { box-sizing: border-box; margin: 0; padding: 0; }

  .pd-header {
    --pd-blue:   #1A3C6E;
    --pd-orange: #E8601C;
    --pd-cream:  #F5F0E8;
    --pd-white:  #FFFFFF;
    --pd-font-b: 'Montserrat', 'Helvetica Neue', sans-serif;
  }

  /* — Full-bleed — */
  .pd-header {
    width: 100vw;
    position: relative;
    left: 50%; right: 50%;
    margin-left: -50vw;
    margin-right: -50vw;
    background: var(--pd-blue);
    font-family: var(--pd-font-b);
    z-index: 100;
  }

  /* — Top bar — */
  .pd-header__topbar {
    background: var(--pd-orange);
    padding: 8px 40px;
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 24px;
  }
  .pd-header__topbar a {
    color: var(--pd-white);
    text-decoration: none;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.03em;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: opacity 0.2s;
  }
  .pd-header__topbar a:hover { opacity: 0.8; }

  /* — Main nav — */
  .pd-header__nav {
    padding: 12px 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    max-width: 1200px;
    margin: 0 auto;
  }

  /* — Logo — */
  .pd-header__logo {
    display: block;
    text-decoration: none;
    line-height: 0;
    transition: opacity 0.2s;
  }
  .pd-header__logo:hover { opacity: 0.85; }
  .pd-header__logo svg {
    height: 52px;
    width: auto;
    display: block;
  }

  /* — Menu links — */
  .pd-header__links {
    display: flex;
    align-items: center;
    gap: 32px;
    list-style: none;
  }
  .pd-header__links a {
    color: rgba(255,255,255,0.80);
    text-decoration: none;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    transition: color 0.2s;
    position: relative;
  }
  .pd-header__links a::after {
    content: '';
    position: absolute;
    bottom: -4px; left: 0;
    width: 0; height: 2px;
    background: var(--pd-orange);
    transition: width 0.25s ease;
  }
  .pd-header__links a:hover { color: var(--pd-white); }
  .pd-header__links a:hover::after { width: 100%; }

  /* — CTA button — */
  .pd-header__cta {
    background: var(--pd-orange) !important;
    color: var(--pd-white) !important;
    text-decoration: none !important;
    padding: 11px 24px !important;
    border-radius: 4px !important;
    font-size: 12px !important;
    font-weight: 700 !important;
    letter-spacing: 0.08em !important;
    text-transform: uppercase !important;
    transition: background 0.2s, transform 0.15s !important;
    white-space: nowrap !important;
  }
  .pd-header__cta:hover { background: #cf541a !important; transform: translateY(-1px) !important; }
  .pd-header__cta::after { display: none !important; }

  /* — Divider — */
  .pd-header__divider {
    height: 1px;
    background: rgba(255,255,255,0.10);
    margin: 0 40px;
  }

  /* — Burger — */
  .pd-header__burger {
    display: none;
    flex-direction: column;
    gap: 5px;
    cursor: pointer;
    padding: 4px;
    background: none;
    border: none;
  }
  .pd-header__burger span {
    display: block;
    width: 24px; height: 2px;
    background: var(--pd-white);
    border-radius: 2px;
    transition: transform 0.3s, opacity 0.3s;
  }

  /* — Mobile menu — */
  .pd-header__mobile-menu {
    display: none;
    flex-direction: column;
    background: var(--pd-blue);
    padding: 20px 40px 28px;
    gap: 16px;
    border-top: 1px solid rgba(255,255,255,0.1);
  }
  .pd-header__mobile-menu a {
    color: rgba(255,255,255,0.85);
    text-decoration: none;
    font-size: 15px;
    font-weight: 500;
    padding: 6px 0;
    border-bottom: 1px solid rgba(255,255,255,0.07);
  }
  .pd-header__mobile-menu a:last-child {
    border-bottom: none;
    margin-top: 8px;
    color: var(--pd-orange);
    font-weight: 700;
  }
  .pd-header__mobile-menu.pd-open { display: flex; }

  /* — Responsive — */
  @media (max-width: 768px) {
    .pd-header__topbar { padding: 7px 20px; }
    .pd-header__nav { padding: 10px 20px; }
    .pd-header__links { display: none; }
    .pd-header__burger { display: flex; }
    .pd-header__divider { margin: 0 20px; }
    .pd-header__logo svg { height: 38px; }
  }
</style>

<script>
(function(){
  var btn  = document.getElementById('pd-burger');
  var menu = document.getElementById('pd-mobile-menu');
  if (btn && menu) {
    btn.addEventListener('click', function(){ menu.classList.toggle('pd-open'); });
  }
  document.querySelectorAll('.pd-header a[href^="#"]').forEach(function(link){
    link.addEventListener('click', function(e){
      var target = document.querySelector(this.getAttribute('href'));
      if (target) {
        e.preventDefault();
        target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        if (menu) menu.classList.remove('pd-open');
      }
    });
  });
})();
</script>
